name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: go vet
        run: go vet ./...

      - name: go vet, intel
        run: GOOS=darwin GOARCH=amd64 go vet ./...

      - name: go test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: cross-compile for intel
        run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/ratatouille

      - name: smoke test
        run: |
          go build -o ratatouille ./cmd/ratatouille
          ./ratatouille version
          ./ratatouille help
          ./ratatouille surface --depth 1

  nix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build
        run: |
          nix build --print-build-logs
          ./result/bin/ratatouille version
